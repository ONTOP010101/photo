                // 更新全选复选框状态
                const selectAllCheckbox = document.getElementById('selectAllCheckbox');
                if (selectAllCheckbox) {
                    selectAllCheckbox.checked = false;
                }
                
                // 更新选中信息
                updateSelectionInfo();
                
                return;
            }
            
            // 使用对应页面的选择状态
            const currentSelected = selectedProductCodes[status] || new Set();
            const selectedProductCodesSet = new Set(currentSelected);
            
            // 对货号分组进行排序，新入的货号排在顶部
            const sortedProductCodes = Object.keys(mergedGroups).sort((a, b) => {
                // 获取每个货号分组中最新照片的时间戳
                function getLatestTimestamp(productCode) {
                    const photos = mergedGroups[productCode];
                    if (photos.length === 0) return 0;
                    // 找到时间戳最大的照片
                    return Math.max(...photos.map(photo => new Date(photo.timestamp).getTime()));
                }
                
                // 按时间戳降序排序，最新的货号排在前面
                return getLatestTimestamp(b) - getLatestTimestamp(a);
            });
            
            // 分页逻辑
            const totalItems = sortedProductCodes.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentPageProductCodes = sortedProductCodes.slice(startIndex, endIndex);
            
            // 生成HTML
            let html = '<div class="product-groups">';
            
            // 计算24小时内的时间戳，用于判断是否为新上传的照片
            const twentyFourHoursAgo = new Date().getTime() - 24 * 60 * 60 * 1000;
            
            currentPageProductCodes.forEach((groupKey, index) => {
                // 生成唯一ID，格式为 product-group-1, product-group-2 等（倒序）
                const groupId = `product-group-${(sortedProductCodes.length - startIndex - index)}`;
                let productPhotos = mergedGroups[groupKey];
                
                // 从分组键中提取原始货号，去除所有批次ID和时间戳
                let productCode = groupKey;
                
                // 1. 先处理下划线分隔的情况（如 123-1_1774004192518）
                if (productCode.includes('_')) {
                    const parts = productCode.split('_');
                    if (parts.length > 1) {
                        productCode = parts[0];
                    }
                }
                
                // 2. 处理连字符分隔的情况，去除批次ID和时间戳
                // 找到第一个连字符后包含时间戳的部分并去除
                // 时间戳通常是13位数字，如1774013466067
                productCode = productCode.replace(/-(\d{10,15})[-\w]*$/, '');
                
                // 3. 清理货号，确保只包含字母、数字和连字符
                productCode = productCode.replace(/[^a-zA-Z0-9-]/g, '').trim();
                
                // 对照片进行排序，确保按照文件名的正确顺序排列
                productPhotos.sort((a, b) => {
                    // 提取文件名中的数字部分进行排序
                    function extractNumber(filename) {
                        // 尝试匹配括号内的数字，如 (1), (2), (3)
                        const match = filename.match(/\((\d+)\)/);
                        if (match) {
                            return parseInt(match[1]);
                        }
                        // 尝试匹配连字符后的数字，如 -1, -2, -3
                        const hyphenMatch = filename.match(/-(\d+)/);
                        if (hyphenMatch) {
                            return parseInt(hyphenMatch[1]);
                        }
                        // 尝试匹配任何位置的数字
                        const anyMatch = filename.match(/(\d+)/);
                        if (anyMatch) {
                            return parseInt(anyMatch[1]);
                        }
                        return 0;
                    }
                    
                    return extractNumber(a.filename) - extractNumber(b.filename);
                });
                
                // 检查是否为新上传的货号（24小时内）
                const isNewProduct = productPhotos.some(photo => new Date(photo.timestamp).getTime() > twentyFourHoursAgo);
                
                // 获取该货号下的唯一用户名
                const usernames = [...new Set(productPhotos.map(photo => photo.username).filter(Boolean))];
                const usernameText = usernames.length > 0 ? ` (${usernames.join(', ')})` : '';
                
                // 检查是否需要默认勾选：只有新上传且未被用户清除的货号才自动勾选
                const shouldBeChecked = selectedProductCodesSet.has(groupKey) || (isNewProduct && !clearedProductCodes.has(groupKey));
                
                html += `

                                    <i class="fas fa-box"></i>
                                    ${productCode}${usernameText}
                                    <span class="product-count">${productPhotos.length}</span>

                            <div class="product-actions">

                                <button class="action-btn" style="background: #e74c3c; color: white; box-shadow: 0 2px 5px rgba(231, 76, 60, 0.3);" onclick="confirmDeleteProductPhotos('${groupKey}')">
                                    <i class="fas fa-trash-alt"></i>
                                    全部删除
                                </button>
                            </div>
                        </div>
                        <div class="photo-grid">
                `;
                
                productPhotos.forEach(photo => {
                    const encodedPath = encodeURI(photo.path);
                    const safeProductCode = photo.productCode || '';
                    html += `
                        <div class="photo-item">
                            <div class="photo-container">
                                <img loading="lazy" src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 width%3D%22200%22 height%3D%22150%22 viewBox%3D%220 0 200 150%22%3E%3Crect width%3D%22200%22 height%3D%22150%22 fill%3D%22%23f0f0f0%22%3E%3C%2Frect%3E%3Ctext x%3D%22100%22 y%3D%2285%22 font-family%3D%22Arial%22 font-size%3D%2214%22 text-anchor%3D%22middle%22 fill%3D%22%23999%22%3E加载中%3C%2Ftext%3E%3C%2Fsvg%3E" data-src="${encodedPath}" alt="${photo.filename}" onclick="viewPhoto(${photo.id}, '${encodedPath}', '${photo.filename}', '${safeProductCode}', '${photo.timestamp}', '${photo.username}')" style="cursor: pointer;" onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 width%3D%22200%22 height%3D%22150%22 viewBox%3D%220 0 200 150%22%3E%3Crect width%3D%22200%22 height%3D%22150%22 fill%3D%22%23f0f0f0%22%3E%3C%2Frect%3E%3Ctext x%3D%22100%22 y%3D%2285%22 font-family%3D%22Arial%22 font-size%3D%2214%22 text-anchor%3D%22middle%22 fill%3D%22%23999%22%3E图片不存在%3C%2Ftext%3E%3C%2Fsvg%3E'; this.onerror=null;">
                                <div class="photo-overlay">
                                    <div class="overlay-actions">
                                        <button class="overlay-btn view" onclick="viewPhoto(${photo.id}, '${encodedPath}', '${photo.filename}', '${safeProductCode}', '${photo.timestamp}', '${photo.username}')">
                                            <i class="fas fa-eye"></i>

                html += `

            html += '</div>';
            
            // 添加分页控件
            if (totalPages > 1) {

            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            if (productCheckboxes.length > 0) {

            // 更新选中信息

    }
        
        // 搜索和筛选
        function filterPhotos() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            filteredPhotos = allPhotos.filter(photo => {
                if (!photo) return false;
                // 搜索筛选
                const matchesSearch = (photo.filename && photo.filename.toLowerCase().includes(searchTerm)) || 
                                     (photo.productCode && photo.productCode.toLowerCase().includes(searchTerm));
                
                // 日期筛选
                let matchesDate = true;
                const startDate = document.getElementById('customDateStart').value;
                const endDate = document.getElementById('customDateEnd').value;
                
                if (startDate && endDate && photo.timestamp) {
                    const photoDate = new Date(photo.timestamp);
                    const start = new Date(startDate);
                    const end = new Date(endDate);
                    matchesDate = photoDate >= start && photoDate <= end;
                }
                
                return matchesSearch && matchesDate;
            });
            
            currentPage = 1; // 搜索时重置为第一页
            displayPhotos(currentStatus);
            // 更新筛选后的统计数据
            document.getElementById('totalPhotosCount').textContent = filteredPhotos.length;
            
            // 根据当前视图更新统计数据
            const currentView = document.getElementById('currentView').textContent;
            if (currentView === '已导出照片') {
                // 已导出页面：只显示已导出的照片数据
                document.getElementById('exportedPhotosCount').textContent = filteredPhotos.length;
                document.getElementById('unexportedPhotosCount').textContent = '0';
            } else if (currentView === '未导出照片') {
                // 未导出页面：只显示未导出的照片数据
                document.getElementById('exportedPhotosCount').textContent = '0';
                document.getElementById('unexportedPhotosCount').textContent = filteredPhotos.length;
            } else {
                // 全部照片页面：显示所有照片数据
                const exportedPhotos = filteredPhotos.filter(photo => photo && photo.exported === true);
                const unexportedPhotos = filteredPhotos.filter(photo => photo && photo.exported !== true);
                document.getElementById('exportedPhotosCount').textContent = exportedPhotos.length;
                document.getElementById('unexportedPhotosCount').textContent = unexportedPhotos.length;
            }
        }
        

        
        // 保存日期时间值到localStorage
        function saveDateValues() {
            const startDate = document.getElementById('customDateStart').value;
            const endDate = document.getElementById('customDateEnd').value;
            
            try {
                localStorage.setItem('customDateStart', startDate);
                localStorage.setItem('customDateEnd', endDate);
            } catch (error) {
                console.error('localStorage访问被阻止:', error);
            }
        }
        
        // 从localStorage恢复日期时间值
        function restoreDateValues() {
            try {
                const startDate = localStorage.getItem('customDateStart');
                const endDate = localStorage.getItem('customDateEnd');
                
                if (startDate) {
                    document.getElementById('customDateStart').value = startDate;
                }
                if (endDate) {
                    document.getElementById('customDateEnd').value = endDate;
                }
            } catch (error) {
                console.error('localStorage访问被阻止:', error);
            }
        }
        
        // 自定义日期变化事件
        document.getElementById('customDateStart').addEventListener('change', function() {
            saveDateValues();

    // 导出到Excel
    async function exportToExcel() {
        // 确定要导出的照片：只导出勾选的照片
        let photosToExport = [];
        
        // 获取当前页面的状态
        const currentView = document.getElementById('currentView').textContent;
        let status = 'all';
        if (currentView === '全部照片') {
            status = 'all';
        } else if (currentView === '已导出照片') {
            status = 'exported';
        } else if (currentView === '未导出照片') {
            status = 'unexported';
        }
        
        // 从 selectedProductCodes 中获取所有选中的货号
        const selectedProductCodesSet = selectedProductCodes[status] || new Set();
        const selectedCodes = Array.from(selectedProductCodesSet);
        
        if (selectedCodes.length === 0) {
            alert('请先选择要导出的货号');
            return;
        }
        
        // 收集选中货号的照片
        photosToExport = filteredPhotos.filter(photo => {
            if (!photo) return false;
            // 检查照片的货号是否在选中的分组键中
            return selectedCodes.some(groupKey => {
                let groupProductCode = groupKey.split('_')[0];
                let photoProductCode = photo.productCode || '';
                
                // 提取原始货号，去除批次ID和后缀
                if (groupProductCode.includes('-') && groupProductCode.split('-').length > 2) {
                    groupProductCode = groupProductCode.split('-').slice(0, 2).join('-');
                }
                if (photoProductCode.includes('-') && photoProductCode.split('-').length > 2) {
                    photoProductCode = photoProductCode.split('-').slice(0, 2).join('-');
                }
                // 提取纯货号（去除后缀）
                if (groupProductCode.match(/^\d+-\d+$/)) {
                    groupProductCode = groupProductCode.split('-')[0];
                }
                if (photoProductCode.match(/^\d+-\d+$/)) {
                    photoProductCode = photoProductCode.split('-')[0];
                }
                
                // 如果 photoProductCode 为空，尝试用 filename 匹配
                if (!photoProductCode && photo.filename) {
                    const filenameBase = photo.filename.replace(/\.[^/.]+$/, '').split(/[-_\s]/)[0];
                    if (filenameBase && groupProductCode.replace(/\s+/g, '').toLowerCase() === filenameBase.toLowerCase()) {
                        return true;
                    }
                }
                
                return groupProductCode.replace(/\s+/g, '') === photoProductCode.replace(/\s+/g, '');
            });
        });
        
        if (photosToExport.length === 0) {
            alert('没有符合条件的照片可导出');
            return;
        }
        
        // 打开进度模态框
        const exportProgressModal = document.getElementById('exportProgressModal');
        const exportModalTitle = exportProgressModal.querySelector('.modal-title');
        if (exportModalTitle) {
            exportModalTitle.textContent = '导出 Excel 表格';
        }
        exportProgressModal.classList.add('active');
        
        // 初始化导出变量
        let exportCanceled = false;
        
        try {
            // 按用户勾选的货号分组，使用selectedCodes作为键确保匹配
            const groupedPhotos = {};
            selectedCodes.forEach(groupKey => {
                groupedPhotos[groupKey] = [];
            });

            photosToExport.forEach(photo => {
                if (!photo) return;
                for (const groupKey of selectedCodes) {
                    let groupProductCode = groupKey;
                    let photoProductCode = photo.productCode || '';

                    if (groupProductCode.includes('_')) {
                        groupProductCode = groupProductCode.split('_')[0];
                    }
                    if (groupProductCode.includes('-') && groupProductCode.split('-').length > 2) {
                        groupProductCode = groupProductCode.split('-').slice(0, 2).join('-');
                    }
                    if (photoProductCode.includes('-') && photoProductCode.split('-').length > 2) {
                        photoProductCode = photoProductCode.split('-').slice(0, 2).join('-');
                    }
                    if (groupProductCode.match(/^\d+-\d+$/)) {
                        groupProductCode = groupProductCode.split('-')[0];
                    }
                    if (photoProductCode.match(/^\d+-\d+$/)) {
                        photoProductCode = photoProductCode.split('-')[0];
                    }

                    // 如果 photoProductCode 为空，尝试用 filename 匹配
                    if (!photoProductCode && photo.filename) {
                        const filenameBase = photo.filename.replace(/\.[^/.]+$/, '').split(/[-_\s]/)[0];
                        if (filenameBase && groupProductCode.replace(/\s+/g, '').toLowerCase() === filenameBase.toLowerCase()) {
                            groupedPhotos[groupKey].push(photo);
                            break;
                        }
                    }

                    if (groupProductCode.replace(/\s+/g, '') === photoProductCode.replace(/\s+/g, '')) {
                        groupedPhotos[groupKey].push(photo);
                        break;
                    }
                }
            });

            // 按照用户勾选的货号顺序排序
            const productCodes = [];
            selectedCodes.forEach(groupKey => {
                if (!productCodes.includes(groupKey)) {
                    productCodes.push(groupKey);
                }
            });
            
            // 统计每个纯货号的出现次数，用于检测重复（忽略大小写）
            const productCodeCount = {};
            productCodes.forEach(productCode => {
                let pureProductCode = productCode;
                // 去除时间戳、随机码和批次ID，只保留纯货号
                // 先处理下划线分隔的情况（如 123-1_1774004192518）
                if (pureProductCode.includes('_')) {
                    const parts = pureProductCode.split('_');
                    if (parts.length > 1) {
                        pureProductCode = parts[0];
                    }
                }
                
                // 处理连字符分隔的情况，去除批次ID（如 123-1-1774004192518-abc123）
                if (pureProductCode.includes('-')) {
                    // 找到最后一个连字符，去除后面的批次ID
                    const lastHyphenIndex = pureProductCode.lastIndexOf('-');
                    if (lastHyphenIndex > 0) {
                        const lastPart = pureProductCode.substring(lastHyphenIndex + 1);
                        // 检查最后一部分是否为批次ID（包含数字和字母，长度大于5）
                        if ((/^[0-9]+$/.test(lastPart) && lastPart.length >= 5) || 
                            (/^[0-9a-zA-Z]+$/.test(lastPart) && lastPart.length > 8)) {
                            pureProductCode = pureProductCode.substring(0, lastHyphenIndex);
                        }
                    }
                }
                // 转换为小写进行统计，忽略大小写
                const lowerProductCode = pureProductCode.toLowerCase();
                const count = groupedPhotos[productCode].length;
                if (count > 0) {
                    productCodeCount[lowerProductCode] = (productCodeCount[lowerProductCode] || 0) + count;
                }
            });
            const totalSteps = productCodes.length;
            let currentStep = 0;
            let totalPhotos = 0;
            productCodes.forEach(code => {
                totalPhotos += groupedPhotos[code].length;
            });
            let processedPhotos = 0;
            
            // 更新进度条
            updateExportProgress(0, '正在准备导出表格...');
            
            // 计算最大照片数量，用于动态生成列
            let maxPhotos = 0;
            for (const productCode of productCodes) {
                const productPhotos = groupedPhotos[productCode];
                if (productPhotos && productPhotos.length > maxPhotos) {
                    maxPhotos = productPhotos.length;
                }
            }
            
            // 辅助函数：根据索引生成Excel列字母（支持超过26列）
            function getColLetter(index) {
                let letter = '';
                let i = index;
                while (i >= 0) {
                    letter = String.fromCharCode(65 + (i % 26)) + letter;
                    i = Math.floor(i / 26) - 1;
                }
                return letter;
            }
            
            // 创建新的Excel工作簿
            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('照片导出');
            
            // 设置标题行 - 动态生成
            worksheet.getCell('A1').value = '货号';
            worksheet.getColumn('A').width = 20;
            
            for (let i = 0; i < maxPhotos; i++) {
                const colLetter = getColLetter(i + 1); // B, C, D, ... (从第2列开始)
                worksheet.getCell(colLetter + '1').value = '3(' + (i + 1) + ')插图';
                worksheet.getColumn(colLetter).width = 30;
            }

            // 创建调试工作表
            var debugWs = workbook.addWorksheet('调试信息');
            debugWs.getCell('A1').value = '步骤';
            debugWs.getCell('B1').value = '状态';
            debugWs.getCell('C1').value = '详情';
            debugWs.getColumn('A').width = 30;
            debugWs.getColumn('B').width = 15;
            debugWs.getColumn('C').width = 80;
            var debugRow = 2;
            debugWs.getCell('A' + debugRow).value = 'ExcelJS版本';
            debugWs.getCell('B' + debugRow).value = '4.3.0';
            debugRow++;
            debugWs.getCell('A' + debugRow).value = '测试图片添加';
            debugWs.getCell('B' + debugRow).value = typeof testImageId !== 'undefined' ? '成功(id:' + testImageId + ')' : '失败';
            debugRow++;
            
            // 处理每个货号
            let rowIndex = 2; // 从第二行开始
            const imagePromises = [];
            const failedExports = [];
            
            for (const productCode of productCodes) {
                if (exportCanceled) {
                    throw new Error('导出已取消');
                }
                
                currentStep++;
                const productPhotos = groupedPhotos[productCode];
                
                // 对照片进行排序，确保按照文件名的正确顺序排列
                productPhotos.sort((a, b) => {
                    // 提取文件名中的数字部分进行排序
                    function extractNumber(filename) {
                        // 尝试匹配括号内的数字，如 (1), (2), (3)
                        const match = filename.match(/\((\d+)\)/);
                        if (match) {
                            return parseInt(match[1]);
                        }
                        // 尝试匹配连字符后的数字，如 -1, -2, -3
                        const hyphenMatch = filename.match(/-(\d+)/);
                        if (hyphenMatch) {
                            return parseInt(hyphenMatch[1]);
                        }
                        // 尝试匹配任何位置的数字
                        const anyMatch = filename.match(/(\d+)/);
                        if (anyMatch) {
                            return parseInt(anyMatch[1]);
                        }
                        return 0;
                    }
                    
                    return extractNumber(a.filename) - extractNumber(b.filename);
                });
                
                // 设置货号，确保去除所有时间戳和随机码，与h3标签显示一致
                let displayProductCode = productCode;
                
                // 1. 先处理下划线分隔的情况（如 123-1_1774004192518）
                if (displayProductCode.includes('_')) {
                    const parts = displayProductCode.split('_');
                    if (parts.length > 1) {
                        displayProductCode = parts[0];
                    }
                }
                
                // 2. 处理连字符分隔的情况，去除批次ID和时间戳
                // 找到第一个连字符后包含时间戳的部分并去除
                // 时间戳通常是13位数字，如1774013466067
                displayProductCode = displayProductCode.replace(/-(\d{10,15})[-\w]*$/, '');
                
                // 3. 清理货号，确保只包含字母、数字和连字符
                displayProductCode = displayProductCode.replace(/[^a-zA-Z0-9-]/g, '').trim();
                worksheet.getCell(`A${rowIndex}`).value = displayProductCode;
                
                // 设置行高
                worksheet.getRow(rowIndex).height = 200;
                
                // 填充照片到对应的列（不限制数量）
                for (let colIndex = 0; colIndex < productPhotos.length; colIndex++) {
                    if (exportCanceled) {
                        throw new Error('导出已取消');
                    }
                    
                    const photo = productPhotos[colIndex];
                    const colLetter = getColLetter(colIndex + 1); // B, C, D, E, F, G, H, I...
                    const cellAddress = colLetter + rowIndex;
                    
                    // 构建完整的图片URL - 使用当前页面的域名
                    let imageUrl = photo.path;
                    if (!imageUrl.startsWith('http')) {
                        const currentDomain = window.location.origin;
                        if (!imageUrl.startsWith('/')) {
                            imageUrl = '/' + imageUrl;
                        }
                        imageUrl = currentDomain + imageUrl;
                    }
                    
                    // 更新进度
                    processedPhotos++;
                    const progress = (processedPhotos / totalPhotos) * 85;
                    updateExportProgress(progress, '正在导出表格: ' + productCode + ' - ' + photo.filename + '...');
                    
                    // 下载图片并嵌入到Excel
                    const ext = (function() {
                        if (!photo.filename) return 'jpeg';
                        const lf = photo.filename.toLowerCase();
                        if (lf.endsWith('.png')) return 'png';
                        if (lf.endsWith('.gif')) return 'gif';
                        return 'jpeg';
                    })();

                    const curCellAddress = cellAddress;
                    const curPhoto = photo;
                    const curImageUrl = imageUrl;
                    const curColIndex = colIndex;
                    const curRowIndex = rowIndex;
                    const curDebugRow = debugRow;
                    debugRow++;

                    debugWs.getCell('A' + curDebugRow).value = curPhoto.filename || '未知';
                    debugWs.getCell('C' + curDebugRow).value = 'URL: ' + curImageUrl;

                    const promise = fetch(curImageUrl, {
                        method: 'GET',
                        headers: { 'Accept': 'image/*' },
                        cache: 'default'
                    })
                        .then(function(response) {
                            if (!response.ok) {
                                throw new Error('HTTP ' + response.status);
                            }
                            var ct = response.headers.get('content-type') || '';
                            var detectedExt = ext;
                            if (ct.indexOf('image/png') !== -1) detectedExt = 'png';
                            else if (ct.indexOf('image/gif') !== -1) detectedExt = 'gif';
                            else if (ct.indexOf('image/webp') !== -1) detectedExt = 'jpeg';
                            debugWs.getCell('C' + curDebugRow).value += ' | CT: ' + ct + ' | Ext: ' + detectedExt;
                            return response.blob().then(function(blob) {
                                return { blob: blob, detectedExt: detectedExt };
                            });
                        })
                        .then(function(data) {
                            var blob = data.blob;
                            var detectedExt = data.detectedExt;
                            if (!blob || blob.size === 0) {
                                throw new Error('图片数据为空');
                            }
                            debugWs.getCell('C' + curDebugRow).value += ' | BlobSize: ' + blob.size;
                            return new Promise(function(resolve, reject) {
                                var reader = new FileReader();
                                reader.onload = function() {
                                    var result = reader.result;
                                    if (!result || result.length < 100) {
                                        reject(new Error('读取图片数据失败(len=' + (result ? result.length : 0) + ')'));
                                        return;
                                    }
                                    var commaIdx = result.indexOf(',');
                                    if (commaIdx === -1) {
                                        reject(new Error('图片数据格式错误(无逗号)'));
                                        return;
                                    }
                                    var base64Part = result.substring(commaIdx + 1);
                                    if (!base64Part || base64Part.length < 50) {
                                        reject(new Error('图片base64数据无效(len=' + (base64Part ? base64Part.length : 0) + ')'));
                                        return;
                                    }
                                    debugWs.getCell('C' + curDebugRow).value += ' | B64Len: ' + base64Part.length;
                                    try {
                                        var imageId = workbook.addImage({
                                            base64: base64Part,
                                            extension: detectedExt
                                        });
                                        debugWs.getCell('C' + curDebugRow).value += ' | ImgId: ' + imageId;
                                        worksheet.addImage(imageId, {
                                            tl: { col: curColIndex + 1, row: curRowIndex - 1 },
                                            br: { col: curColIndex + 2, row: curRowIndex }
                                        });
                                        debugWs.getCell('B' + curDebugRow).value = '成功';
                                        debugWs.getCell('C' + curDebugRow).value += ' | tl(col=' + (curColIndex + 1) + ',row=' + (curRowIndex - 1) + ') br(col=' + (curColIndex + 2) + ',row=' + curRowIndex + ')';
                                        resolve();
                                    } catch(imgErr) {
                                        debugWs.getCell('B' + curDebugRow).value = 'addImage异常';
                                        debugWs.getCell('C' + curDebugRow).value += ' | Err: ' + imgErr.message;
                                        reject(imgErr);
                                    }
                                };
                                reader.onerror = function() {
                                    reject(new Error('FileReader读取失败'));
                                };
                                reader.readAsDataURL(blob);
                            });
                        })
                        .catch(function(error) {
                            console.error('处理图片 ' + curImageUrl + ' 失败:', error);
                            debugWs.getCell('B' + curDebugRow).value = '失败';
                            debugWs.getCell('C' + curDebugRow).value += ' | CatchErr: ' + error.message;
                            worksheet.getCell(curCellAddress).value = error.message || '图片嵌入失败';
                            failedExports.push({
                                filename: curPhoto.filename,
                                productCode: curPhoto.productCode || '未知货号',
                                error: error.message
                            });
                        });
                    
                    imagePromises.push(promise);
                    
                    // 短暂延迟，让用户看到进度变化
                    await new Promise(resolve => setTimeout(resolve, 50));
                }
                
                rowIndex++;
            }
            
            // 处理失败的导出
            if (failedExports.length > 0) {
                // 创建一个新的工作表用于记录失败的导出
                const failedWorksheet = workbook.addWorksheet('导出失败列表');
                
                // 设置表头
                failedWorksheet.getCell('A1').value = '货号';
                failedWorksheet.getCell('B1').value = '文件名';
                failedWorksheet.getCell('C1').value = '错误信息';
                
                // 设置列宽
                failedWorksheet.getColumn('A').width = 20;
                failedWorksheet.getColumn('B').width = 40;
                failedWorksheet.getColumn('C').width = 60;
                
                // 填充失败的导出记录
                for (let i = 0; i < failedExports.length; i++) {
                    const item = failedExports[i];
                    failedWorksheet.getCell(`A${i + 2}`).value = item.productCode;
                    failedWorksheet.getCell(`B${i + 2}`).value = item.filename;
                    failedWorksheet.getCell(`C${i + 2}`).value = item.error;
                }
            }
            
            updateExportProgress(85, '正在生成Excel文件...');
            
            // 等待所有图片下载完成
            await Promise.all(imagePromises);
            
            updateExportProgress(95, '正在准备下载表格...');
            
            // 导出Excel文件
            const exportName = `照片导出_${new Date().toISOString().slice(0, 10)}.xlsx`;
            const buffer = await workbook.xlsx.writeBuffer();
            
            updateExportProgress(100, '表格导出完成！');
            
            // 创建下载链接
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = exportName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            // 标记导出的照片为已导出并更新服务器
            // 收集所有要更新的照片ID
            const photoIdsToUpdate = [];
            for (let i = 0; i < photosToExport.length; i++) {
                const photo = photosToExport[i];
                if (photo) {
                    photo.exported = true;
                    photoIdsToUpdate.push(photo.id);
                }
            }
            
            // 使用批量更新API，一次性更新所有导出状态，避免并发冲突
            if (photoIdsToUpdate.length > 0) {
                try {
                    await fetch('/api/photos/batch/exported', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ ids: photoIdsToUpdate, exported: true })
                    });
                } catch (error) {
                    console.error('批量更新导出状态失败:', error);
                }
            }
            
            // 额外延迟，确保服务器端文件写入完成
            await new Promise(resolve => setTimeout(resolve, 500));
            
            // 更新统计数据
            updateStats();
            
            // 重新加载数据以更新视图
            const currentViewText = document.getElementById('currentView').textContent;
            await loadPhotos();
            if (currentViewText === '全部照片') {
                filterPhotosByExportStatus('all');
            } else if (currentViewText === '已导出照片') {
                filterPhotosByExportStatus('exported');
            } else if (currentViewText === '未导出照片') {
                filterPhotosByExportStatus('unexported');
            }
            
            // 关闭进度模态框
            setTimeout(() => {
                closeModal('exportProgressModal');
                let message = `成功导出 ${productCodes.length} 个货号的 ${totalPhotos} 张照片到 ${exportName}`;
                if (failedExports.length > 0) {
                    message += `\n有 ${failedExports.length} 张图片导出失败，已在Excel文件中生成"导出失败列表"工作表`;
                }
                alert(message);
            }, 1000);
        } catch (error) {
            console.error('导出Excel失败:', error);
            updateExportProgress(0, `导出失败: ${error.message}`);
            setTimeout(() => {
                closeModal('exportProgressModal');
                if (!exportCanceled) {
                    alert('导出Excel失败: ' + error.message);
                }
            }, 1000);
        }
    }
    
    // 导出筛选后的照片
    function exportFilteredPhotos() {
        const selectedCheckboxes = document.querySelectorAll('.product-checkbox:checked');
        if (selectedCheckboxes.length === 0) {
            alert('请先选择要导出的货号');
            return;
        }
        
        // 收集选中的货号
        const selectedProductCodes = Array.from(selectedCheckboxes).map(checkbox => checkbox.value);
        
        // 收集所有选中货号的照片
        const photosToExport = [];
        filteredPhotos.forEach(photo => {
            if (photo) {
                // 检查照片的货号是否在选中的分组键中
                const isSelected = selectedProductCodes.some(groupKey => {
                    const groupProductCode = groupKey.split('_')[0];
                    const photoProductCode = (photo.productCode || '').replace(/\s+/g, '');
                    // groupKey 是处理后的原始货号（如 "684"），photo.productCode 是完整格式（如 "684-1778xxx"）
                    // 所以应该检查 photo.productCode 是否以 groupKey 开头
                    return photoProductCode === groupProductCode || photoProductCode.startsWith(groupProductCode + '-');
                });
                if (isSelected) {
                    photosToExport.push(photo);
                }
            }
        });
        
        if (photosToExport.length === 0) {
            alert('选中的货号没有照片');
            return;
        }
        
        // 显示选中的货号和图片数量
        alert(`已选择 ${selectedProductCodes.length} 个货号，共 ${photosToExport.length} 张图片`);
        
        // 保存选中的照片
        window.selectedBatchPhotos = photosToExport;
        window.exportType = 'normal'; // 标记为普通导出
        
        // 弹出命名模态框
        document.getElementById('exportNameModal').classList.add('active');
    }
    
    // 确认导出名称
    async function confirmExportName() {
        const exportName = document.getElementById('exportName').value.trim();
        if (!exportName) {
            alert('请输入压缩包名称');
            return;
        }
        
        // 检查是否需要同时导出 Excel
        const exportExcel = document.getElementById('exportExcel').checked;
        
        // 关闭命名模态框
        closeModal('exportNameModal');
        
        // 打开进度模态框
        const exportProgressModal = document.getElementById('exportProgressModal');
        const exportModalTitle = exportProgressModal.querySelector('.modal-title');
        if (exportModalTitle) {
            exportModalTitle.textContent = '导出图片';
        }
        exportProgressModal.classList.add('active');
        
        // 初始化导出变量
        exportZip = new JSZip();
        exportCanceled = false;
        
        // 确定要导出的照片：只导出勾选的照片
        let photosToExport = window.selectedBatchPhotos || [];
        
        // 如果没有批量选择的照片，检查是否有勾选的货号
        if (photosToExport.length === 0) {
            // 获取当前页面的状态
            const currentView = document.getElementById('currentView').textContent;
            let status = 'all';
            if (currentView === '全部照片') {
                status = 'all';
            } else if (currentView === '已导出照片') {
                status = 'exported';
            } else if (currentView === '未导出照片') {
                status = 'unexported';
            }
            
            // 从 selectedProductCodes 中获取所有选中的货号
            const selectedProductCodesSet = selectedProductCodes[status] || new Set();
            const selectedCodes = Array.from(selectedProductCodesSet);
            
            if (selectedCodes.length === 0) {
                closeModal('exportProgressModal');
                alert('请先选择要导出的货号');
                return;
            }
            
            // 收集选中货号的照片
            photosToExport = filteredPhotos.filter(photo => {
                if (!photo) return false;
                // 检查照片的货号是否在选中的分组键中
                return selectedCodes.some(groupKey => {
                    const groupProductCode = groupKey.split('_')[0];
                    const photoProductCode = (photo.productCode || '').replace(/\s+/g, '');
                    // groupKey 是处理后的原始货号（如 "684"），photo.productCode 是完整格式（如 "684-1778xxx"）
                    // 所以应该检查 photo.productCode 是否以 groupKey 开头
                    return photoProductCode === groupProductCode || photoProductCode.startsWith(groupProductCode + '-');
                });
            });
        }
        
        // 检查是否有符合条件的照片
        if (photosToExport.length === 0) {
            closeModal('exportProgressModal');
            alert('没有符合条件的照片可导出');
            return;
        }
        
        // 清除批量选择的照片
        window.selectedBatchPhotos = null;
        
        try {
            // 如果需要同时导出 Excel
            if (exportExcel) {
                // 先导出 Excel
                await exportToExcel();
            }
            
            // 更新进度条
            updateExportProgress(0, '正在准备导出...');
            
            const validPhotos = photosToExport.filter(p => p && p.filename && p.path);
            const totalPhotos = validPhotos.length;
            
            // 收集文件路径和导出文件名，并逐步更新进度
            const photoPaths = [];
            const photoFilenames = [];
            for (let i = 0; i < validPhotos.length; i++) {
                const p = validPhotos[i];
                photoPaths.push(p.path);
                photoFilenames.push(p.filename);
                
                // 每处理10张或最后一张更新进度
                if (i % 10 === 0 || i === validPhotos.length - 1) {
                    const progress = (i / validPhotos.length) * 30;
                    updateExportProgress(progress, `正在准备文件: ${i + 1}/${validPhotos.length}...`);
                    // 小延迟让UI有机会更新
                    await new Promise(resolve => setTimeout(resolve, 1));
                }
            }
            
            // 模拟服务端生成ZIP的进度
            const encouragingMessages = [
                '正在努力打包中...',
                '快好啦，请耐心等待哦 😊',
                '正在压缩图片文件...',
                '马上就好，再等等~',
                '正在整理您的照片...',
                '加油加油，就快完成了！',
                '还差一点点啦...',
                '正在做最后的准备工作...'
            ];
            let zipProgress = 30;
            let messageIndex = 0;
            let messageTimer = 0;
            const zipProgressInterval = setInterval(() => {
                if (zipProgress < 80) {
                    zipProgress += Math.random() * 3;
                    messageTimer++;
                    // 每10次更新换一条温馨提示（更快）
                    if (messageTimer >= 10) {
                        messageTimer = 0;
                        messageIndex = (messageIndex + 1) % encouragingMessages.length;
                    }
                    const message = zipProgress < 50 
                        ? `正在服务端生成ZIP (${totalPhotos}张)...`
                        : encouragingMessages[messageIndex];
                    updateExportProgress(Math.min(zipProgress, 80), message);
                }
            }, 100);
            
            // 发送到服务端创建ZIP
            const resp = await fetch('/api/export/zip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paths: photoPaths, filenames: photoFilenames, exportName })
            });
            
            // 清除进度模拟
            clearInterval(zipProgressInterval);
            
            if (!resp.ok) {
                throw new Error(`服务端ZIP创建失败: ${resp.status}`);
            }
            
            const result = await resp.json();
            
            updateExportProgress(90, '正在下载ZIP...');
            
            window.location.href = `/api/export/download/${result.token}?name=${encodeURIComponent(result.filename)}`;
            
            updateExportProgress(100, '导出完成！');
            
            const processedCount = result.count;
            
            // 标记导出的照片为已导出并更新服务器
            // 收集所有要更新的照片ID
            const photoIdsToUpdate = [];
            for (let i = 0; i < photosToExport.length; i++) {
                const photo = photosToExport[i];
                if (photo) {
                    photo.exported = true;
                    photoIdsToUpdate.push(photo.id);
                }
            }
            
            // 使用批量更新API，一次性更新所有导出状态，避免并发冲突
            if (photoIdsToUpdate.length > 0) {
                try {
                    await fetch('/api/photos/batch/exported', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ ids: photoIdsToUpdate, exported: true })
                    });
                } catch (error) {
                    console.error('批量更新导出状态失败:', error);
                }
            }
            
            // 额外延迟，确保服务器端文件写入完成
            await new Promise(resolve => setTimeout(resolve, 500));
            
            // 更新统计数据
            updateStats();
            
            // 重新加载数据以更新视图
            const currentViewText = document.getElementById('currentView').textContent;
            await loadPhotos();
            // 恢复视图状态
            if (currentViewText === '全部照片') {
                filterPhotosByExportStatus('all');
            } else if (currentViewText === '已导出照片') {
                filterPhotosByExportStatus('exported');
            } else if (currentViewText === '未导出照片') {
                filterPhotosByExportStatus('unexported');
            }
            
            // 关闭进度模态框
            setTimeout(() => {
                closeModal('exportProgressModal');
                if (exportExcel) {
                    alert(`成功导出 ${processedCount} 张照片到 ${exportName}.zip\n同时已导出 Excel 表格`);
                } else {
                    alert(`成功导出 ${processedCount} 张照片到 ${exportName}.zip`);
                }
            }, 1000);
        } catch (error) {
            console.error('导出失败:', error);
            updateExportProgress(0, `导出失败: ${error.message}`);
            setTimeout(() => {
                closeModal('exportProgressModal');
                if (!exportCanceled) {
                    alert(`导出失败: ${error.message}`);
                }
            }, 1000);
        } finally {
            exportZip = null;
            exportCanceled = false;
        }
    }

    // 生成失败导出的CSV表格
    function generateFailedExportCSV(failedExports) {
        // CSV表头
        let csv = '货号,文件名,错误信息\n';
        
        // 遍历失败的导出记录
        failedExports.forEach(item => {
            // 处理CSV中的特殊字符
            const productCode = item.productCode ? item.productCode.replace(/"/g, '""') : '';
            const filename = item.filename ? item.filename.replace(/"/g, '""') : '';
            const error = item.error ? item.error.replace(/"/g, '""') : '';
            
            // 添加到CSV行
            csv += `"${productCode}","${filename}","${error}"\n`;
        });
        
        return csv;
    }
    
    // 更新选中信息
    function updateSelectionInfo() {
        const productCheckboxes = document.querySelectorAll('.product-checkbox');
        const selectedCheckboxes = Array.from(productCheckboxes).filter(checkbox => checkbox.checked);
        
        // 计算当前页面中选中的货号
        const selectedProductCodesArray = selectedCheckboxes.map(checkbox => checkbox.value);
        
        // 计算重复货号数量
        const productCodeCounts = {};
        selectedProductCodesArray.forEach(groupKey => {
            // 提取货号（去除后缀和批次ID，与h3显示的货号保持一致）
            let productCode = groupKey;
            
            // 1. 先处理下划线分隔的情况（如 123-1_1774013466067）
            if (productCode.includes('_')) {
                const parts = productCode.split('_');
                if (parts.length > 1) {
                    productCode = parts[0];
                }
            }
            
            // 2. 移除用户名信息（如"3 (YX02)"中的" (YX02)"部分）
            productCode = productCode.replace(/\s*\([^)]*\)$/, '');
            
            // 3. 处理连字符分隔的情况，去除系统生成的批次ID
            // 系统生成的批次ID格式：货号-时间戳-随机数-随机字符串
            // 例如：522-2-3-1774013466067-123456-abcdef
            // 提取用户输入的原始货号，移除系统生成的批次ID部分
            // 1. 找到第一个10-15位数字的时间戳部分
            const timestampMatch = productCode.match(/-([0-9]{10,15})-/);
            if (timestampMatch) {
                // 提取时间戳之前的部分作为原始货号
                const timestampIndex = timestampMatch.index;
                productCode = productCode.substring(0, timestampIndex);
            }
            
            // 4. 处理连字符分隔的情况，只去除末尾的时间戳部分（10-15位数字）
            // 保留用户手动输入的批次号（如"2356-4-1"中的"-1"）
            // 只有当数字长度在10-15位之间时才视为时间戳
            productCode = productCode.replace(/-([0-9]{10,15})\b$/, '');
            
            // 5. 确保用户手动输入的货号被完整保留
            // 对于短数字后缀（如"522-2-3"中的"-3"），不视为时间戳，完整保留
            
            // 4. 清理货号，确保只包含字母、数字和连字符
            productCode = productCode.replace(/[^a-zA-Z0-9-]/g, '').trim();
            
            productCodeCounts[productCode] = (productCodeCounts[productCode] || 0) + 1;
        });
        
        // 计算重复货号数量（出现次数大于1的货号）并收集重复货号
        let duplicateCount = 0;
        const duplicateProductCodes = [];
        for (const [productCode, count] of Object.entries(productCodeCounts)) {
            if (count > 1 && productCode) { // 只统计非空货号
                duplicateCount++;
                duplicateProductCodes.push(productCode);
            }
        }
        
        // 计算异常图片数量并收集异常图片信息
        let errorPhotosCount = 0;
        const errorPhotos = [];
        if (filteredPhotos.length > 0) {
            filteredPhotos.forEach(photo => {
                if (!photo) return;
                // 检查照片是否在选中的分组中
                const isSelected = selectedProductCodesArray.some(groupKey => {
                    const groupProductCode = groupKey.split('_')[0];
                    const photoProductCode = (photo.productCode || '').replace(/\s+/g, '');
                    // groupKey 是处理后的原始货号（如 "684"），photo.productCode 是完整格式（如 "684-1778xxx"）
                    // 所以应该检查 photo.productCode 是否以 groupKey 开头
                    return photoProductCode === groupProductCode || photoProductCode.startsWith(groupProductCode + '-');
                });
                if (isSelected) {
                    // 检查图片是否存在（通过路径是否有效判断）
                    // 这里简化处理，实际项目中可能需要更复杂的判断
                    if (!photo.path || photo.path === '/uploads/') {
                        errorPhotosCount++;
                        errorPhotos.push(`${photo.productCode || '未分类'}-${photo.filename || '未知文件'}`);
                    }
                }
            });
        }
        
        // 计算带空格货号的数量并收集带空格货号
        let spaceProductCodeCount = 0;
        const spaceProductCodes = [];
        selectedProductCodesArray.forEach(groupKey => {
            // 提取货号（去除后缀和批次ID，与h3显示的货号保持一致）
            let productCode = groupKey;
            
            // 1. 先处理下划线分隔的情况（如 123-1_1774004192518）
            if (productCode.includes('_')) {
                const parts = productCode.split('_');
                if (parts.length > 1) {
                    productCode = parts[0];
                }
            }
            
            // 2. 移除用户名信息（如"3 (YX02)"中的" (YX02)"部分）
            productCode = productCode.replace(/\s*\([^)]*\)$/, '');
            
            // 3. 处理连字符分隔的情况，去除系统生成的批次ID
            // 系统生成的批次ID格式：货号-时间戳-随机数-随机字符串
            // 例如：522-2-3-1774013466067-123456-abcdef
            // 提取用户输入的原始货号，移除系统生成的批次ID部分
            // 1. 找到第一个10-15位数字的时间戳部分
            const timestampMatch = productCode.match(/-([0-9]{10,15})-/);
            if (timestampMatch) {
                // 提取时间戳之前的部分作为原始货号
                const timestampIndex = timestampMatch.index;
                productCode = productCode.substring(0, timestampIndex);
            }
            
            // 4. 处理连字符分隔的情况，只去除末尾的时间戳部分（10-15位数字）
            // 保留用户手动输入的批次号（如"2356-4-1"中的"-1"）
            // 只有当数字长度在10-15位之间时才视为时间戳
            productCode = productCode.replace(/-([0-9]{10,15})\b$/, '');
            
            // 5. 确保用户手动输入的货号被完整保留
            // 对于短数字后缀（如"522-2-3"中的"-3"），不视为时间戳，完整保留
            
            // 4. 清理货号，确保只包含字母、数字和连字符
            productCode = productCode.replace(/[^a-zA-Z0-9-]/g, '').trim();
            
            // 检查货号是否包含空格
            if (productCode.includes(' ')) {
                if (!spaceProductCodes.includes(productCode)) {
                    spaceProductCodeCount++;
                    spaceProductCodes.push(productCode);
                }
            }
        });
        
        // 更新对应页面的选择状态
        const currentView = document.getElementById('currentView').textContent;
        let status = 'all';
        if (currentView === '全部照片') {
            status = 'all';
        } else if (currentView === '已导出照片') {
            status = 'exported';
        } else if (currentView === '未导出照片') {
            status = 'unexported';
        }
        
        // 保存当前页面的选择状态
        const currentSelected = new Set();
        selectedCheckboxes.forEach(checkbox => {
            currentSelected.add(checkbox.value);
        });
        selectedProductCodes[status] = currentSelected;
        
        // 计算已选择的照片数量
        let selectedPhotosCount = 0;
        if (filteredPhotos.length > 0) {
            const selectedPhotos = filteredPhotos.filter(photo => {
                if (!photo) return false;
                // 检查照片的货号是否在选中的分组键中
                return selectedProductCodesArray.some(groupKey => {
                    const groupProductCode = groupKey.split('_')[0];
                    const photoProductCode = (photo.productCode || '').replace(/\s+/g, '');
                    // groupKey 是处理后的原始货号（如 "684"），photo.productCode 是完整格式（如 "684-1778xxx"）
                    // 所以应该检查 photo.productCode 是否以 groupKey 开头
                    return photoProductCode === groupProductCode || photoProductCode.startsWith(groupProductCode + '-');
                });
            });
            selectedPhotosCount = selectedPhotos.length;
        }
        
        const selectionInfo = document.getElementById('selectionInfo');
        if (selectionInfo) {
            let message = `已选择 ${selectedProductCodesArray.length} 个货号，共 ${selectedPhotosCount} 张图片`;
            let errorMessage = '';
            let duplicateMessage = '';
            let spaceMessage = '';
            
            if (duplicateCount > 0) {
                duplicateMessage = `<span style="color: red; font-weight: bold;">（其中 ${duplicateCount} 个货号重复：${duplicateProductCodes.join(', ')}）</span>`;
            }
            
            if (errorPhotosCount > 0) {
                errorMessage = `<span style="color: orange; font-weight: bold;">（其中 ${errorPhotosCount} 张图片异常：${errorPhotos.slice(0, 5).join(', ')}${errorPhotos.length > 5 ? '...' : ''}）</span>`;
            }
            
            if (spaceProductCodeCount > 0) {
                spaceMessage = `<span style="color: purple; font-weight: bold;">（其中 ${spaceProductCodeCount} 个货号带空格：${spaceProductCodes.join(', ')}，可能导致导出缺失图片）</span>`;
            }
            
            if (duplicateMessage) {
                // 合并重复货号提示和导出图片可能会被覆盖的提示
                const combinedMessage = duplicateMessage.replace('）', ',导出图片可能会被覆盖，请仔细检查！!!）');
                selectionInfo.innerHTML = message + ' ' + combinedMessage + ' ' + errorMessage;
            } else if (errorMessage) {
                selectionInfo.innerHTML = message + ' ' + errorMessage;
            } else {
                selectionInfo.textContent = message;
            }

        // 更新全选复选框状态
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        if (selectAllCheckbox && productCheckboxes.length > 0) {

            selectAllCheckbox.checked = allChecked;
        }

    // 反选
    function toggleSelectInverse() {
        const productCheckboxes = document.querySelectorAll('.product-checkbox');
        let hasChecked = false;
        let hasUnchecked = false;
        
        // 获取当前页面的状态
        const currentView = document.getElementById('currentView').textContent;
        let status = 'all';
        if (currentView === '全部照片') {
            status = 'all';

            status = 'exported';
        } else if (currentView === '未导出照片') {
            status = 'unexported';
        }
        
        // 清空对应页面的选择状态
        selectedProductCodes[status].clear();
        
        productCheckboxes.forEach(checkbox => {
            if (checkbox.checked) {
                hasChecked = true;
            } else {
                hasUnchecked = true;
            }
            checkbox.checked = !checkbox.checked;
            if (checkbox.checked) {
                selectedProductCodes[status].add(checkbox.value);
            }
        });
        
        // 更新全选复选框状态
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        if (hasChecked && !hasUnchecked) {
            selectAllCheckbox.checked = false;
        } else if (!hasChecked && hasUnchecked) {
            selectAllCheckbox.checked = true;
        } else {
            selectAllCheckbox.checked = false;
        }
        
        // 更新选中信息
        updateSelectionInfo();
    }

    // 修改confirmExportName函数，支持按货号创建独立文件夹

        }

        const exportModalTitle = exportProgressModal.querySelector('.modal-title');
        if (exportModalTitle) {
            exportModalTitle.textContent = '导出图片';
        }
        exportProgressModal.classList.add('active');
        
        // 初始化导出变量
        exportZip = new JSZip();
        exportCanceled = false;
        
        // 确定要导出的照片：只导出勾选的照片
        let photosToExport = window.selectedBatchPhotos || [];
        const exportType = window.exportType || 'normal';
        
        // 如果没有批量选择的照片，检查是否有勾选的货号
        if (photosToExport.length === 0) {
            // 获取当前页面的状态
            const currentView = document.getElementById('currentView').textContent;
            let status = 'all';
            if (currentView === '全部照片') {
                status = 'all';
            } else if (currentView === '已导出照片') {
                status = 'exported';
            } else if (currentView === '未导出照片') {
                status = 'unexported';
            }
            
            // 从 selectedProductCodes 中获取所有选中的货号
            const selectedProductCodesSet = selectedProductCodes[status] || new Set();
            const selectedCodes = Array.from(selectedProductCodesSet);
            
            if (selectedCodes.length === 0) {
                closeModal('exportProgressModal');
                alert('请先选择要导出的货号');
                return;
            }
            
            // 收集选中货号的照片
            photosToExport = filteredPhotos.filter(photo => {
                if (!photo) return false;
                // 检查照片的货号是否在选中的分组键中
                return selectedCodes.some(groupKey => {
                    const groupProductCode = groupKey.split('_')[0];
                    const photoProductCode = (photo.productCode || '').replace(/\s+/g, '');
                    // groupKey 是处理后的原始货号（如 "684"），photo.productCode 是完整格式（如 "684-1778xxx"）
                    // 所以应该检查 photo.productCode 是否以 groupKey 开头
                    return photoProductCode === groupProductCode || photoProductCode.startsWith(groupProductCode + '-');
                });
            });
        }
        
        // 检查是否有符合条件的照片
        if (photosToExport.length === 0) {
            closeModal('exportProgressModal');
            alert('没有符合条件的照片可导出');
            return;
        }
        
        // 清除批量选择的照片
        window.selectedBatchPhotos = null;
        window.exportType = null;
        
        // 统计每个纯货号的出现次数，用于检测重复（区分大小写）
        const productCodeCount = {};
        photosToExport.forEach(photo => {
            let productCode = photo.productCode || '';
            if (productCode) {
                // 去除时间戳、随机码和批次ID，只保留纯货号
                // 先处理下划线分隔的情况（如 123-1_1774004192518）
                if (productCode.includes('_')) {
                    const parts = productCode.split('_');
                    if (parts.length > 1) {
                        productCode = parts[0];
                    }
                }
                
                // 处理连字符分隔的情况，去除批次ID（如 123-1-1774004192518-abc123）
                if (productCode.includes('-')) {
                    // 找到最后一个连字符，去除后面的批次ID
                    const lastHyphenIndex = productCode.lastIndexOf('-');
                    if (lastHyphenIndex > 0) {
                        const lastPart = productCode.substring(lastHyphenIndex + 1);
                        // 检查最后一部分是否为批次ID（包含数字和字母）
                        if (/^[0-9a-zA-Z]+$/.test(lastPart) && lastPart.length > 5) {
                            productCode = productCode.substring(0, lastHyphenIndex);
                        }
                    }
                }
                
                // 直接使用原始货号进行统计，区分大小写
                productCodeCount[productCode] = (productCodeCount[productCode] || 0) + 1;
            }
        });
        
        try {
            // 如果需要同时导出 Excel
            if (exportExcel) {
                // 先导出 Excel
                await exportToExcel();
            }
            
            // 更新进度条
            updateExportProgress(0, '正在准备导出...');
            
            // 计算导出文件名(含文件夹前缀用于individual模式)
            const photoPaths = [];
            const photoFilenames = [];
            const failedExports = [];
            const totalPhotos = photosToExport.length;
            
            for (let i = 0; i < photosToExport.length; i++) {
                const photo = photosToExport[i];
                if (!photo || !photo.filename || !photo.path) {
                    failedExports.push({
                        filename: photo ? photo.filename : '未知',
                        productCode: photo && photo.productCode ? photo.productCode : '未知',
                        error: '无效数据'
                    });
                    continue;
                }
                
                let exportFilename = photo.filename;
                if (exportFilename.includes('_')) {
                    exportFilename = exportFilename.split('_')[0];
                } else if (exportFilename.includes('-')) {
                    const parts = exportFilename.split('-');
                    if (parts.length > 2 && /^\d+$/.test(parts[parts.length - 1])) {
                        exportFilename = parts.slice(0, 2).join('-');
                    }
                }
                
                let pureProductCode = photo.productCode || '';
                if (pureProductCode) {
                    if (pureProductCode.includes('_')) {
                        pureProductCode = pureProductCode.split('_')[0];
                    }
                    pureProductCode = pureProductCode.replace(/-(\d{10,15})[-\w]*$/, '');
                    pureProductCode = pureProductCode.replace(/[^a-zA-Z0-9-]/g, '').trim();
                }
                
                if (!exportFilename.includes('.')) {
                    const ext = (photo.path || '').split('.').pop();
                    if (ext && ['jpg','jpeg','png','gif','webp'].includes(ext.toLowerCase())) {
                        exportFilename += '.' + ext;
                    }
                }
                
                photoPaths.push(photo.path);
                if (exportType === 'individual' && pureProductCode) {
                    photoFilenames.push(pureProductCode.replace(/\s+/g, '') + '/' + exportFilename);
                } else {
                    photoFilenames.push(exportFilename);
                }
                
                // 每处理10张或最后一张更新进度
                if (i % 10 === 0 || i === photosToExport.length - 1) {
                    const progress = (i / photosToExport.length) * 30;
                    updateExportProgress(progress, `正在准备文件: ${i + 1}/${photosToExport.length}...`);
                    // 小延迟让UI有机会更新
                    await new Promise(resolve => setTimeout(resolve, 1));
                }
            }
            
            // 模拟服务端生成ZIP的进度
            const encouragingMessages = [
                '正在努力打包中...',
                '快好啦，请耐心等待哦 😊',
                '正在压缩图片文件...',
                '马上就好，再等等~',
                '正在整理您的照片...',
                '加油加油，就快完成了！',
                '还差一点点啦...',
                '正在做最后的准备工作...'
            ];
            let zipProgress = 30;
            let messageIndex = 0;
            let messageTimer = 0;
            const zipProgressInterval = setInterval(() => {
                if (zipProgress < 80) {
                    zipProgress += Math.random() * 3;
                    messageTimer++;
                    // 每10次更新换一条温馨提示（更快）
                    if (messageTimer >= 10) {
                        messageTimer = 0;
                        messageIndex = (messageIndex + 1) % encouragingMessages.length;
                    }
                    const message = zipProgress < 50 
                        ? `正在服务端生成ZIP (${photoPaths.length}张)...`
                        : encouragingMessages[messageIndex];
                    updateExportProgress(Math.min(zipProgress, 80), message);
                }
            }, 100);
            
            const resp2 = await fetch('/api/export/zip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paths: photoPaths, filenames: photoFilenames, exportName })
            });
            
            // 清除进度模拟
            clearInterval(zipProgressInterval);
            
            if (!resp2.ok) {
                throw new Error(`服务端ZIP创建失败: ${resp2.status}`);
            }
            
            const result2 = await resp2.json();
            
            updateExportProgress(90, '正在下载ZIP...');
            
            window.location.href = `/api/export/download/${result2.token}?name=${encodeURIComponent(result2.filename)}`;
            
            updateExportProgress(100, '导出完成！');
            
            successfullyExported = result2.count;
            
            // 标记导出的照片为已导出并更新服务器
            const exportStatusPromises = [];
            for (let i = 0; i < photosToExport.length; i++) {
                const photo = photosToExport[i];
                if (photo) {
                    photo.exported = true;
                    exportStatusPromises.push(
                        fetch(`/api/photos/${photo.id}/exported`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ exported: true })
                        }).catch(error => {
                            console.error('更新导出状态失败:', error);
                        })
                    );
                }
            }
            
            // 等待所有服务器更新完成后再刷新界面
            await Promise.all(exportStatusPromises);
            
            // 更新统计数据
            updateStats();
            
            // 重新加载数据以更新视图
            const currentViewText = document.getElementById('currentView').textContent;
            await loadPhotos();
            if (currentViewText === '全部照片') {
                filterPhotosByExportStatus('all');
            } else if (currentViewText === '已导出照片') {
                filterPhotosByExportStatus('exported');
            } else if (currentViewText === '未导出照片') {
                filterPhotosByExportStatus('unexported');
            }
            
            // 显示完成消息
            setTimeout(() => {
                closeModal('exportProgressModal');
                let message = `成功导出 ${successfullyExported} 张图片到压缩包: ${exportName}.zip`;
                if (failedExports.length > 0) {
                    message += `\n有 ${failedExports.length} 张图片导出失败，已在压缩包中生成"导出失败列表.csv"`;
                }
                alert(message);
            }, 1000);
            
        } catch (error) {
            console.error('导出失败:', error);
            closeModal('exportProgressModal');
            alert('导出失败，请重试');
        }
    }
    
    // 根据导出状态过滤照片
    function filterPhotosByExportStatus(status) {
        let viewText = '';
        let bgGradient = '';
        
        // 重置所有按钮的样式
        const allBtn = document.querySelector('button[onclick="filterPhotosByExportStatus(\'all\')"]');
        const exportedBtn = document.querySelector('button[onclick="filterPhotosByExportStatus(\'exported\')"]');
        const unexportedBtn = document.querySelector('button[onclick="filterPhotosByExportStatus(\'unexported\')"]');
        
        if (allBtn) {
            allBtn.style.background = '';
            allBtn.style.color = '';
        }
        if (exportedBtn) {
            exportedBtn.style.background = '';
            exportedBtn.style.color = '';
        }
        if (unexportedBtn) {
            unexportedBtn.style.background = '';
            unexportedBtn.style.color = '';
        }
        
        switch(status) {
            case 'all':
                filteredPhotos = [...allPhotos];
                viewText = '全部照片';
                bgGradient = 'linear-gradient(135deg, #3498db, #2980b9)';
                if (allBtn) {
                    allBtn.style.background = '#3498db';
                    allBtn.style.color = 'white';
                }
                break;
            case 'exported':
                filteredPhotos = allPhotos.filter(photo => photo && photo.exported === true);
                viewText = '已导出照片';
                bgGradient = 'linear-gradient(135deg, #27ae60, #229954)';
                if (exportedBtn) {
                    exportedBtn.style.background = '#27ae60';
                    exportedBtn.style.color = 'white';
                }
                break;
            case 'unexported':
                filteredPhotos = allPhotos.filter(photo => photo && photo.exported !== true);
                viewText = '未导出照片';
                bgGradient = 'linear-gradient(135deg, #e74c3c, #c0392b)';
                if (unexportedBtn) {
                    unexportedBtn.style.background = '#e74c3c';
                    unexportedBtn.style.color = 'white';
                }
                break;
        }
        // 更新当前视图显示

        // 更新状态显示div的背景颜色

    // 保存货号和后缀修改
    async function saveProductCodeChanges() {
        const groupKey = document.getElementById('editGroupKey').value;
        const newProductCode = document.getElementById('editProductCode').value.trim();
        const suffix = document.getElementById('editProductSuffix').value;
        const batchId = document.getElementById('editBatchId').value;
        
        if (!newProductCode) {
            alert('请输入货号');
            return;
        }
        
        let newProductCodeValue = newProductCode + batchId;
        
        const photosToUpdate = [];
        
        const productPhotos = allPhotos.filter(photo => {
            return photo && (photo.productCode || '') === (groupKey || '');
        });
        
        allPhotos.forEach(photo => {
            if (photo && (photo.productCode || '') === (groupKey || '') && photo.filename) {
                    const photoIndex = productPhotos.indexOf(photo) + 1;
                    
                    let originalExtension = '';
                    const pathParts = photo.path.split('.');
                    if (pathParts.length > 1) {
                        originalExtension = pathParts.pop();
                    }
                    const validImageExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
                    const hasExtension = originalExtension && validImageExtensions.includes(originalExtension.toLowerCase());
                    
                    let newFilename;
                    if (suffix === '-1') {
                        newFilename = `${newProductCode}-${photoIndex}${hasExtension ? `.${originalExtension}` : ''}`;
                    } else if (suffix === '(1)') {
                        newFilename = `${newProductCode}(${photoIndex})${hasExtension ? `.${originalExtension}` : ''}`;
                    } else {
                        newFilename = `${newProductCode}-${photoIndex}${hasExtension ? `.${originalExtension}` : ''}`;
                    }
                    
                    photosToUpdate.push({
                        id: photo.id,
                        productCode: newProductCodeValue,
                        filename: newFilename
                    });
                    
                    photo.productCode = newProductCodeValue;
                    photo.filename = newFilename;
                }
        });
        
        filteredPhotos.forEach(photo => {
            if (photo && (photo.productCode || '') === (groupKey || '') && photo.filename) {
                    const photoIndex = productPhotos.indexOf(photo) + 1;
                    
                    let originalExtension = '';
                    const pathParts = photo.path.split('.');
                    if (pathParts.length > 1) {
                        originalExtension = pathParts.pop();
                    }
                    const validImageExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
                    const hasExtension = originalExtension && validImageExtensions.includes(originalExtension.toLowerCase());
                    
                    let newFilename;
                    if (suffix === '-1') {
                        newFilename = `${newProductCode}-${photoIndex}${hasExtension ? `.${originalExtension}` : ''}`;
                    } else if (suffix === '(1)') {
                        newFilename = `${newProductCode}(${photoIndex})${hasExtension ? `.${originalExtension}` : ''}`;
                    } else {
                        newFilename = `${newProductCode}-${photoIndex}${hasExtension ? `.${originalExtension}` : ''}`;
                    }
                    
                    photo.productCode = newProductCodeValue;
                    photo.filename = newFilename;
                }
        });
        
        try {
            for (const photo of photosToUpdate) {
                const response = await fetch(`/api/photos/${photo.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        productCode: photo.productCode || '',
                        filename: photo.filename
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`更新照片${photo.id}失败: ${response.statusText}`);
                }
                
                const result = await response.json();
                console.log('更新照片成功:', result);
            }
            
            const suffixDisplay = suffix ? `，后缀格式${suffix}` : '';
            alert(`已修改货号为：${newProductCode}${suffixDisplay}`);
        } catch (error) {
            console.error('保存货号修改失败:', error);
            alert('保存失败，请重试');
        }
        
        closeEditProductCodeModal();
        
        const currentView = document.getElementById('currentView').textContent;
        let status = 'all';
        if (currentView === '全部照片') {
            status = 'all';
        } else if (currentView === '已导出照片') {
            status = 'exported';
        } else if (currentView === '未导出照片') {
            status = 'unexported';
        }
        
        for (const statusKey in selectedProductCodes) {
            if (selectedProductCodes[statusKey].has(groupKey)) {
                selectedProductCodes[statusKey].delete(groupKey);
                if (photosToUpdate.length > 0) {
                    selectedProductCodes[statusKey].add(photosToUpdate[0].productCode);
                }
            }
        }
        
        displayPhotos(status);
    }

    // 添加拖拽功能
    function addDragFunctionality() {
        if (!cropAreaElement) return;
        
        cropAreaElement.onmousedown = function(e) {
            isDragging = true;
            startX = e.clientX - cropAreaElement.offsetLeft;
            startY = e.clientY - cropAreaElement.offsetTop;
            document.body.style.cursor = 'move';
        };
        
        document.onmousemove = function(e) {
            if (!isDragging) return;
            
            const container = cropAreaElement.parentElement;
            const containerRect = container.getBoundingClientRect();
            
            let newX = e.clientX - containerRect.left - startX;
            let newY = e.clientY - containerRect.top - startY;
            
            // 限制在容器内
            newX = Math.max(0, Math.min(newX, container.clientWidth - cropAreaElement.clientWidth));
            newY = Math.max(0, Math.min(newY, container.clientHeight - cropAreaElement.clientHeight));
            
            cropAreaElement.style.left = newX + 'px';
            cropAreaElement.style.top = newY + 'px';
            
            // 更新输入框值
            document.getElementById('cropX').value = Math.round(newX);
            document.getElementById('cropY').value = Math.round(newY);
        };
        
        document.onmouseup = function() {
            isDragging = false;
            document.body.style.cursor = '';
        };
    }
    
    // 重置裁剪区域
    function resetCrop() {
        if (!cropImageElement || !cropAreaElement) return;
        
        const imageWidth = cropImageElement.naturalWidth;
        const imageHeight = cropImageElement.naturalHeight;
        
        // 设置默认裁剪区域为300x300，居中显示
        const cropWidth = 300;
        const cropHeight = 300;
        const cropX = Math.max(0, (imageWidth - cropWidth) / 2);
        const cropY = Math.max(0, (imageHeight - cropHeight) / 2);
        
        // 更新裁剪区域样式
        cropAreaElement.style.width = cropWidth + 'px';
        cropAreaElement.style.height = cropHeight + 'px';
        cropAreaElement.style.left = cropX + 'px';
        cropAreaElement.style.top = cropY + 'px';
        
        // 更新输入框值
        document.getElementById('cropWidth').value = cropWidth;
        document.getElementById('cropHeight').value = cropHeight;
        document.getElementById('cropX').value = Math.round(cropX);
        document.getElementById('cropY').value = Math.round(cropY);
