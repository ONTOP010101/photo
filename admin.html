    // 裁剪照片
    async function cropPhoto() {
        if (!cropImageElement || !currentPhotoId) return;
        
        // 获取裁剪参数
        const cropWidth = parseInt(document.getElementById('cropWidth').value);
        const cropHeight = parseInt(document.getElementById('cropHeight').value);
        const cropX = parseInt(document.getElementById('cropX').value);
        const cropY = parseInt(document.getElementById('cropY').value);
        
        // 创建Canvas元素
        const canvas = document.createElement('canvas');
        canvas.width = cropWidth;
        canvas.height = cropHeight;
        const ctx = canvas.getContext('2d');
        
        // 绘制裁剪区域
        ctx.drawImage(
            cropImageElement,
            cropX, cropY, cropWidth, cropHeight,
            0, 0, cropWidth, cropHeight
        );
        
        // 转换为Blob并上传到服务器
        canvas.toBlob(async function(blob) {
            try {
                // 创建FormData对象
                const formData = new FormData();
                formData.append('photo', blob, 'cropped.jpg');
                
                // 上传到服务器
                const response = await fetch(`/api/photos/${currentPhotoId}`, {
                    method: 'PUT',
                    body: formData
                });
                
                if (response.ok) {
                    alert('裁剪成功，已覆盖原图！');
                    // 重新加载数据以更新视图
                    loadPhotos();
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    alert(`裁剪失败: ${errorData.error || '服务器错误'}`);
                }
            } catch (error) {
                console.error('裁剪失败:', error);
                alert('裁剪失败: 网络错误');
            } finally {
                // 关闭裁剪模态框
                closeModal('cropModal');
            }
        }, 'image/jpeg', 0.9);
    }
    
    // 压缩图片函数
    function compressImage(base64, quality) {
        return new Promise((resolve, reject) => {
            if (!base64 || typeof base64 !== 'string' || !base64.startsWith('data:')) {
                reject(new Error('无效的图片数据'));
                return;
            }
            const canvas = document.createElement('canvas');
            const img = new Image();
            var loadTimeout = setTimeout(function() {
                reject(new Error('图片加载超时'));
            }, 15000);

            img.onload = function() {
                clearTimeout(loadTimeout);
                try {
                    var maxDimension = 1920;
                    var width = img.width;
                    var height = img.height;

                    if (width > maxDimension || height > maxDimension) {
                        var ratio = Math.min(maxDimension / width, maxDimension / height);
                        width = Math.round(width * ratio);
                        height = Math.round(height * ratio);
                    }

                    canvas.width = width;
                    canvas.height = height;

                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    var compressedDataUrl = canvas.toDataURL('image/jpeg', quality);

                    var base64Part = compressedDataUrl.split(',')[1];
                    if (!base64Part || base64Part.length === 0) {
                        reject(new Error('图片压缩后数据为空'));
                        return;
                    }
                    resolve(base64Part);
                } catch (e) {
                    reject(new Error('图片压缩失败: ' + e.message));
                }
            };

            img.onerror = function() {
                clearTimeout(loadTimeout);
                reject(new Error('图片加载失败'));
            };

            img.src = base64;
        });
    }

    async function loadChatMessages(friendUsername) {
        const username = getCurrentUsername();

            if (response.ok) {

    function renderMessages(messages) {
        const chatMessages = document.getElementById('chatMessages');
        if (!chatMessages) return;
        
        const username = getCurrentUsername();
        
        if (messages.length === 0) {
            chatMessages.innerHTML = `<div style="text-align:center;color:#95a5a6;padding:40px;">暂无消息，开始聊天吧！</div>`;
            return;
        }
        
        let html = '';
        messages.forEach(msg => {
            const isSent = msg.from === username;
            const time = new Date(msg.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            if (msg.type === 'file') {
                const fileExt = (msg.fileName || '').split('.').pop().toLowerCase();
                const isZip = fileExt === 'zip';
                const isExcel = fileExt === 'xlsx' || fileExt === 'xls';
                const iconClass = isZip ? 'fa-file-archive zip' : (isExcel ? 'fa-file-excel excel' : 'fa-file');
                const iconColor = isZip ? '#e67e22' : (isExcel ? '#27ae60' : '#95a5a6');
                
                html += `
                    <div class="message-wrapper ${isSent ? 'sent' : 'received'}">
                        <div>
                            <div class="message-bubble">
                                <div class="message-file">
                                    <div class="message-file-icon">
                                        <i class="fas ${iconClass}" style="color:${iconColor};"></i>
                                    </div>
                                    <div class="message-file-info">
                                        <div class="message-file-name">${msg.fileName || '文件'}</div>
                                        <div class="message-file-size">${formatFileSize(msg.fileSize || 0)}</div>
                                    </div>
                                    ${msg.filePath ? `<a href="${msg.filePath}" class="message-file-download" download target="_blank"><i class="fas fa-download"></i> 下载</a>` : ''}
                                </div>
                            </div>
                            <div class="message-time">${time}</div>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="message-wrapper ${isSent ? 'sent' : 'received'}">
                        <div>
                            <div class="message-bubble">
                                <div class="message-text">${escapeHtml(msg.content || '')}</div>
                            </div>
                            <div class="message-time">${time}</div>
                        </div>
                    </div>
                `;
            }
        });
        
        chatMessages.innerHTML = html;
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
    
    async function sendMessage() {
        const chatInput = document.getElementById('chatInput');
        if (!chatInput) return;
        
        const content = chatInput.value.trim();
        if (!content || !currentChatFriend) return;
        
        const username = getCurrentUsername();
        if (!username) return;
        
        const message = {
            type: 'chat_message',
            from: username,
            to: currentChatFriend.username,
            messageType: 'text',
            content: content
        };
        
        if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
            chatSocket.send(JSON.stringify(message));
        } else {
            try {
                const response = await fetch('/api/chat/messages/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(message)
                });
                if (response.ok) {
                    const result = await response.json();
                    appendMessage(result.message);
                }
            } catch (error) {
                console.error('发送消息失败:', error);
                alert('发送消息失败');
            }
        }
        
        chatInput.value = '';
        chatInput.style.height = 'auto';
    }
    
    async function sendFile(fileInput) {
        const file = fileInput.files[0];
        if (!file || !currentChatFriend) return;
        
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext !== 'zip' && ext !== 'xlsx' && ext !== 'xls') {
            alert('只支持发送 ZIP 和 Excel（.xlsx/.xls）文件！');
            fileInput.value = '';
            return;
        }
        
        if (file.size > 2 * 1024 * 1024 * 1024) {
            alert('文件大小不能超过 2GB！');
            fileInput.value = '';
            return;
        }
        
        const username = getCurrentUsername();
        if (!username) return;
        
        const uploadProgress = document.getElementById('uploadProgress');
        const uploadProgressFill = document.getElementById('uploadProgressFill');
        const uploadProgressText = document.getElementById('uploadProgressText');
        
        if (uploadProgress) uploadProgress.style.display = 'block';
        
        const formData = new FormData();
        formData.append('file', file);
        formData.append('from', username);
        formData.append('to', currentChatFriend.username);
        
        try {
            const xhr = new XMLHttpRequest();
            
            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    if (uploadProgressFill) uploadProgressFill.style.width = percent + '%';
                    if (uploadProgressText) uploadProgressText.textContent = `正在上传: ${file.name} (${percent}%)`;
                }
            };
            
            xhr.onload = async function() {
                if (uploadProgress) uploadProgress.style.display = 'none';
                
                if (xhr.status === 200) {
                    const result = JSON.parse(xhr.responseText);
                    
                    const message = {
                        type: 'chat_message',
                        from: username,
                        to: currentChatFriend.username,
                        messageType: 'file',
                        content: file.name,
                        fileName: result.filename,
                        fileSize: result.size,
                        filePath: result.path,
                        fileType: ext
                    };
                    
                    if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
                        chatSocket.send(JSON.stringify(message));
                    } else {
                        try {
                            const response = await fetch('/api/chat/messages/send', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(message)
                            });
                            if (response.ok) {
                                const res = await response.json();
                                appendMessage(res.message);
                            }
                        } catch (err) {
                            console.error('发送文件消息失败:', err);
                        }
                    }
                } else {
                    alert('文件上传失败，请重试');
                }
            };
            
            xhr.onerror = function() {
                if (uploadProgress) uploadProgress.style.display = 'none';
                alert('文件上传失败，网络错误');
            };
            
            xhr.open('POST', '/api/chat/upload', true);
            xhr.send(formData);
        } catch (error) {
            if (uploadProgress) uploadProgress.style.display = 'none';
            console.error('上传文件失败:', error);
            alert('文件上传失败');
        }
        
        fileInput.value = '';
    }
    
    function appendMessage(msg) {
        const chatMessages = document.getElementById('chatMessages');
        if (!chatMessages) return;
        
        const username = getCurrentUsername();
        const isSent = msg.from === username;
        const time = new Date(msg.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        
        let messageHtml = '';
        if (msg.type === 'file') {
            const fileExt = (msg.fileName || '').split('.').pop().toLowerCase();
            const isZip = fileExt === 'zip';
            const isExcel = fileExt === 'xlsx' || fileExt === 'xls';
            const iconClass = isZip ? 'fa-file-archive zip' : (isExcel ? 'fa-file-excel excel' : 'fa-file');
            const iconColor = isZip ? '#e67e22' : (isExcel ? '#27ae60' : '#95a5a6');
            
            messageHtml = `
                <div class="message-wrapper ${isSent ? 'sent' : 'received'}">
                    <div>
                        <div class="message-bubble">
                            <div class="message-file">
                                <div class="message-file-icon">
                                    <i class="fas ${iconClass}" style="color:${iconColor};"></i>
                                </div>
                                <div class="message-file-info">
                                    <div class="message-file-name">${msg.fileName || '文件'}</div>
                                    <div class="message-file-size">${formatFileSize(msg.fileSize || 0)}</div>
                                </div>
                                ${msg.filePath ? `<a href="${msg.filePath}" class="message-file-download" download target="_blank"><i class="fas fa-download"></i> 下载</a>` : ''}
                            </div>
                        </div>
                        <div class="message-time">${time}</div>
                    </div>
                </div>
            `;
        } else {
            messageHtml = `
                <div class="message-wrapper ${isSent ? 'sent' : 'received'}">
                    <div>
                        <div class="message-bubble">
                            <div class="message-text">${escapeHtml(msg.content || '')}</div>
                        </div>
                        <div class="message-time">${time}</div>
                    </div>
                </div>
            `;
        }
        
        if (chatMessages.querySelector('.loading-state') || chatMessages.querySelector('div[style]')) {
            const placeholder = chatMessages.querySelector('div[style]');
            if (placeholder && placeholder.textContent.includes('暂无消息')) {
                chatMessages.innerHTML = '';
            } else {
                const loadingState = chatMessages.querySelector('.loading-state');
                if (loadingState) loadingState.remove();
            }
        }
        
        chatMessages.insertAdjacentHTML('beforeend', messageHtml);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function connectChatWebSocket() {
        if (chatSocket && chatSocket.readyState === WebSocket.OPEN) return;
        
        try {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
            chatSocket = new WebSocket(wsUrl);
            
            chatSocket.onopen = function() {
                console.log('聊天WebSocket连接已建立');
                const username = getCurrentUsername();
                if (username) {
                    chatSocket.send(JSON.stringify({
                        type: 'register',
                        username: username
                    }));
                }
            };
            
            chatSocket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'chat_message') {
                        const msg = data.message;
                        if (currentChatFriend && 
                            (msg.from === currentChatFriend.username || msg.to === currentChatFriend.username)) {
                            appendMessage(msg);
                        }
                    } else if (data.type === 'typing') {
                        if (currentChatFriend && data.from === currentChatFriend.username) {
                            const typingIndicator = document.getElementById('typingIndicator');
                            if (typingIndicator) {
                                typingIndicator.style.display = data.isTyping ? 'block' : 'none';
                            }
                        }
                    } else if (data.type === 'photo_uploaded') {
                        console.log('收到照片上传消息');
                        debouncedLoadPhotos();
                    }
                } catch (error) {
                    console.error('解析WebSocket消息失败:', error);
                }
            };
            
            chatSocket.onclose = function() {
                console.log('聊天WebSocket连接已关闭，5秒后重连');
                setTimeout(connectChatWebSocket, 5000);
            };
            
            chatSocket.onerror = function(error) {
                console.error('聊天WebSocket错误:', error);
            };
        } catch (error) {
            console.error('建立聊天WebSocket连接失败:', error);
        }
    }
    
    function sendTypingIndicator() {
        if (!currentChatFriend || !chatSocket || chatSocket.readyState !== WebSocket.OPEN) return;
        
        chatSocket.send(JSON.stringify({
            type: 'typing',
            from: getCurrentUsername(),
            to: currentChatFriend.username,
            isTyping: true
        }));
        
        clearTimeout(chatTypingTimer);
        chatTypingTimer = setTimeout(() => {
            if (chatSocket && chatSocket.readyState === WebSocket.OPEN && currentChatFriend) {
                chatSocket.send(JSON.stringify({
                    type: 'typing',
                    from: getCurrentUsername(),
                    to: currentChatFriend.username,
                    isTyping: false
                }));
            }
        }, 2000);
    }

            if (response.ok) {
                const allUsers = await response.json();
                
                const friendsResponse = await fetch(`/api/chat/friends/${username}`);
                let friendUsernames = [];
                if (friendsResponse.ok) {
                    const friends = await friendsResponse.json();
                    friendUsernames = friends.map(f => f.username);
                }
                
                const select = document.getElementById('friendUsername');
                select.innerHTML = '<option value="">请选择用户</option>';
                
                allUsers.forEach(user => {
                    if (user.username !== username && !friendUsernames.includes(user.username)) {
                        select.innerHTML += `<option value="${user.username}">${user.name || user.username} (@${user.username})</option>`;
                    }
                });
                
                if (select.options.length <= 1) {
                    select.innerHTML = '<option value="">没有可添加的用户</option>';
                }
            }
        } catch (error) {
            console.error('获取可添加用户失败:', error);
        }
        
        document.getElementById('addFriendModal').classList.add('active');
    }
    
    async function addFriend() {
        const username = getCurrentUsername();
        const friendUsername = document.getElementById('friendUsername').value;
        
        if (!friendUsername) {
            alert('请选择要添加的好友');
            return;
        }
        
        try {
            const response = await fetch('/api/chat/friends', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, friendUsername })
            });
            
            if (response.ok) {
                alert('好友添加成功！');
                closeModal('addFriendModal');
                loadFriends();
            } else {
                const errorData = await response.json();
                alert(`添加失败: ${errorData.error}`);
            }
        } catch (error) {
            console.error('添加好友失败:', error);
            alert('添加好友失败');
        }
    }
    
    async function deleteFriend(friendUsername) {
        const username = getCurrentUsername();
        if (!confirm(`确定要删除好友 ${friendUsername} 吗？`)) return;
        
        try {
            const response = await fetch('/api/chat/friends', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, friendUsername })
            });
            
            if (response.ok) {
                if (currentChatFriend && currentChatFriend.username === friendUsername) {
                    currentChatFriend = null;
                    document.getElementById('chatMain').innerHTML = `
                        <div class="chat-placeholder">
                            <i class="fas fa-comments" style="font-size: 64px; color: #e0e0e0; margin-bottom: 20px;"></i>
                            <h3>选择一个好友开始聊天</h3>
                            <p>点击左侧好友列表中的好友开始对话</p>
                        </div>
                    `;
                }
                loadFriends();
            } else {
                const errorData = await response.json();
                alert(`删除失败: ${errorData.error}`);
            }
        } catch (error) {
            console.error('删除好友失败:', error);
            alert('删除好友失败');
        }
    }
    </script>
</body>
